<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --left: auto; /* 文字行盒左上角 X (auto = 不按左边定位) */
        --top: auto; /* 文字行盒左上角 Y */
        --right: auto; /* 也可以改成按右边/下边定位 */
        --bottom: 0;
        /* 文本属性 */
        --font-size: 28px;
        --color: #ffffff;
        --opacity: 1; /* 0~1 */
        /* 纯视觉微调, 不影响上面填的坐标 */
        {{/*  --nudge-x: calc(var(--font-size) * 0.125);  */}}
        {{/*  --nudge-y: calc(var(--font-size) * 0.125);  */}}
    }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 必须透明: 反色 shader 靠"文字像素"来定位, 背景不能带颜色 */
        background: transparent;
      }

      #clock {
        position: absolute;
        left: var(--left);
        top: var(--top);
        right: var(--right);
        bottom: var(--bottom);
        transform: translate(var(--nudge-x), var(--nudge-y));
        font-family: "Roboto Condensed";
        font-weight: 900;
        font-size: var(--font-size);
        color: var(--color);
        opacity: var(--opacity);
        white-space: nowrap;
      }

      *::-webkit-scrollbar {
        display: none;
      }

      /* ---- 只给调试用的覆盖层, DEBUG = false 时完全不显示 ---- */
      #dbg-patch,
      #dbg-info {
        display: none;
        position: absolute;
        box-sizing: border-box;
      }

      #dbg-patch {
        border: 2px solid #00e5ff;
        background: rgba(0, 229, 255, 0.15);
      }

      #dbg-info {
        left: 0;
        top: 0;
        font:
          22px Consolas,
          monospace;
        line-height: 1.35;
        color: #00e5ff;
        background: rgba(0, 0, 0, 0.65);
        padding: 6px 10px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="clock"></div>

    <!-- 调试覆盖层 -->
    <div id="dbg-patch"></div>
    <div id="dbg-info"></div>

    <script>
      // 调位置/调滤镜采样区时改成 true: 画布上会显示文字框精确坐标和采样区百分比。
      // ★ 直播/录制前记得改回 false。
      const DEBUG = false;

      // 和滤镜 [2.采样] 里的采样区保持一致, DEBUG 时会画出这块"取色范围"预览
      const PATCH = {cx: 47.5, cy: 91, w: 95, h: 18};

      const clock = document.getElementById("clock");
      const dbgPatch = document.getElementById("dbg-patch");
      const dbgInfo = document.getElementById("dbg-info");
      const fmt = (v) => Math.round(v * 10) / 10;

      function drawDebug() {
        const W = innerWidth;
        const H = innerHeight;
        const r = clock.getBoundingClientRect();

        // 把 [2.采样] 的采样区(相对文字框的百分比)换算成画布坐标画出来
        dbgPatch.style.left = ((PATCH.cx - PATCH.w / 2) / 100) * W + "px";
        dbgPatch.style.top = ((PATCH.cy - PATCH.h / 2) / 100) * H + "px";
        dbgPatch.style.width = (PATCH.w / 100) * W + "px";
        dbgPatch.style.height = (PATCH.h / 100) * H + "px";

        dbgInfo.textContent =
          `画布 ${W} x ${H}\n` +
          `文字框     x=${Math.round(r.left)} y=${Math.round(r.top)}` +
          ` w=${Math.round(r.width)} h=${Math.round(r.height)}\n` +
          `采样区建议 中心X=${fmt(((r.left + r.width / 2) / W) * 100)}` +
          ` 中心Y=${fmt(((r.top + r.height / 2) / H) * 100)}` +
          ` 宽=${fmt((r.width / W) * 100)} 高=${fmt((r.height / H) * 100)}\n` +
          `青色框 = 当前 PATCH 常数 = 滤镜里实际取色的范围`;
      }

      function render() {
        const text = new Date().toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
        // 只在内容变化时写入, 免得每秒都触发一次重排
        if (clock.textContent !== text) clock.textContent = text;
        if (DEBUG) drawDebug();
      }

      if (DEBUG) {
        clock.style.outline = "2px solid #ffea00"; // 黄框 = 文字行盒(实际定位的依据)
        dbgPatch.style.display = "block";
        dbgInfo.style.display = "block";
      }

      render(); // 立刻显示, 不用等第一秒
      setInterval(render, 200);
    </script>
  </body>
</html>
