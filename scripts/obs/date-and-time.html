<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* =====================================================================
         画布尺寸版
         OBS 里把这个浏览器源的「宽度/高度」设成画布大小 (2560 x 1440),
         场景里: 位置 (0,0)、缩放 1.0、边界「无」。
         这样滤镜贴图的 uv 就和画布 1:1, 反色 shader 的对齐参数保持 1/1/0/0。
         文字摆在哪, 只改下面这几个变量。
         ===================================================================== */
      :root {
        /* 字号 */
        --font-size: 256px;
        --color: #ffffff;
        /* 透明度 */
        --opacity: 1; /* 0~1 */
        /* 锚点: flex-start = 左/上, center = 中, flex-end = 右/下 */
        --anchor-x: flex-start;
        --anchor-y: flex-end;
        /* 常用位置 (把上面 --anchor-x / --anchor-y / 边距 换成其中一组):
             左上: --anchor-x: flex-start; --anchor-y: flex-start;
             正上: --anchor-x: center;     --anchor-y: flex-start;
             右上: --anchor-x: flex-end;   --anchor-y: flex-start;
             左下: --anchor-x: flex-start; --anchor-y: flex-end;   ← 当前
             居中: --anchor-x: center;     --anchor-y: center;
             右下: --anchor-x: flex-end;   --anchor-y: flex-end;
        */
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 必须透明: 反色 shader 靠"文字像素"来定位, 背景不能带颜色 */
        background: transparent;
      }

      body {
        display: flex;
        justify-content: var(--anchor-x);
        align-items: var(--anchor-y);
        box-sizing: border-box;
      }

      #clock {
        font-family: "Roboto Condensed";
        font-weight: 900;
        font-size: var(--font-size);
        line-height: 1;
        color: var(--color);
        opacity: var(--opacity);
        white-space: nowrap;
      }

      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <span id="clock"></span>

    <script>
      const clock = document.getElementById("clock");

      function render() {
        const text = new Date().toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
        // 只在内容变化时写入, 免得每秒都触发一次重排
        if (clock.textContent !== text) clock.textContent = text;
      }

      render(); // 立刻显示, 不用等第一秒z
      setInterval(render, 200);
    </script>
  </body>
</html>
